<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Sudoku</h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timer">00:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Mistakes</span>
          <span class="stat-value" id="mistakes">0/3</span>
        </div>
      </div>
    </header>

    <div class="controls-top">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
      </select>
      <button id="new-game">New Game</button>
    </div>

    <main class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      <div id="win-overlay" class="win-overlay hidden">
        <div class="win-card">
          <h2>Solved!</h2>
          <p id="win-message"></p>
          <button id="win-new-game">Play Again</button>
        </div>
      </div>
    </main>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
      <button class="num-btn erase" data-num="0" title="Erase">⌫</button>
    </div>

    <div class="controls-bottom">
      <button id="undo" title="Undo">↶ Undo</button>
      <button id="notes-toggle" title="Toggle pencil notes">✏️ Notes: Off</button>
      <button id="hint" title="Reveal one cell">💡 Hint</button>
      <button id="check" title="Check board for errors">✓ Check</button>
      <button id="solve" title="Solve the puzzle">Solve</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
